version: "3.8"

services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_SESSIONTIMEOUT=24h
      - ND_BASEURL=""
    volumes:
      - /mnt/user/appdata/navidrome:/data
      - /mnt/user/Media/Music:/music:ro # Read-only access for data integrity
    ports:
      - 4533:4533
    restart: unless-stopped
